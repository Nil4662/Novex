# Base44 sandbox runtime for ZAGROS (Vite + React + TypeScript).
#
# Everything runs from the cloned source: the repo is bind-mounted at /app and
# the Vite dev server is started with `npm run dev`, so edits appear instantly.
# In VS Code you do not need this file — use `npm install` + `npm run dev`.

services:
  web:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      # Supplied by the platform; Vite appends it to allowedHosts via
      # __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS and vite.config.ts.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Bind mounts do not always emit native file events inside a container.
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app
      # Dependencies stay in the image/volume layer, never on the sandbox host.
      - node_modules:/app/node_modules
    healthcheck:
      # Transforming /src/main.tsx proves the dev server is compiling, not just
      # that a port is open.
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/src/main.tsx || exit 1
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 120s
    restart: on-failure

volumes:
  node_modules:
